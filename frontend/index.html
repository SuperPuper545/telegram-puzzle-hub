<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Puzzle Hub - Telegram Mini App</title>
    <!-- Telegram WebApp JS script -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      (function() {
        try {
          var tp = null;
          if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.themeParams) {
            tp = window.Telegram.WebApp.themeParams;
          }
          if (!tp || !tp.bg_color) {
            var hash = window.location.hash || '';
            var m = hash.match(/tgWebAppThemeParams=([^&]+)/);
            if (m && m[1]) {
              tp = JSON.parse(decodeURIComponent(m[1]));
            }
          }
          if (tp) {
            var r = document.documentElement;
            if (tp.bg_color) {
              r.style.setProperty('--tg-theme-bg-color', tp.bg_color);
              if (document.body) document.body.style.backgroundColor = tp.bg_color;
            }
            if (tp.secondary_bg_color) r.style.setProperty('--tg-theme-secondary-bg-color', tp.secondary_bg_color);
            if (tp.text_color) r.style.setProperty('--tg-theme-text-color', tp.text_color);
            if (tp.hint_color) r.style.setProperty('--tg-theme-hint-color', tp.hint_color);
            if (tp.link_color) r.style.setProperty('--tg-theme-link-color', tp.link_color);
            if (tp.button_color) r.style.setProperty('--tg-theme-button-color', tp.button_color);
            if (tp.button_text_color) r.style.setProperty('--tg-theme-button-text-color', tp.button_text_color);
            if (tp.header_bg_color) r.style.setProperty('--tg-theme-header-bg-color', tp.header_bg_color);
            if (tp.section_bg_color) r.style.setProperty('--tg-theme-section-bg-color', tp.section_bg_color);
            if (tp.section_separator_color) r.style.setProperty('--tg-theme-section-separator-color', tp.section_separator_color);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-tg-bg text-tg-text">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
